<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}IPL Analytics V2{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --ipl-purple: #6f42c1;
            --ipl-gold: #f4c542;
        }

        body {
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #21113f;
            color: white;
        }

        .sidebar a {
            color: #e3d9f5;
            text-decoration: none;
            display: block;
            padding: 11px 14px;
            border-radius: 8px;
            margin-bottom: 4px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: var(--ipl-purple);
            color: white;
        }

        .brand {
            color: var(--ipl-gold);
            font-weight: 800;
        }

        .main-content {
            min-width: 0;
            flex: 1;
        }

        .card {
            border-radius: 12px;
        }

        .btn-ipl {
            background: var(--ipl-purple);
            color: white;
            border: none;
        }

        .btn-ipl:hover {
            background: #5932a3;
            color: white;
        }

        [data-bs-theme="light"] body {
            background: #f5f2fa;
        }

        [data-bs-theme="light"] .sidebar {
            background: #21113f;
        }

        @media (max-width: 767px) {
            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .dashboard-layout {
                flex-direction: column;
            }
        }
    </style>

    <script>
        const savedTheme = localStorage.getItem("ipl-theme") || "dark";
        document.documentElement.setAttribute("data-bs-theme", savedTheme);
    </script>
</head>

<body>
<div class="dashboard-layout d-flex">

    <aside class="sidebar p-3">
        <h4 class="brand mb-4">IPL ANALYTICS</h4>

        <nav>
            <a href="/">Overview</a>
            <a href="{% url 'players:player_search' %}">Players</a>
            <a href="{% url 'players:player_comparison' %}">Player Comparison</a>
            <a href="{% url 'batting_analytics' %}">Batting Analytics</a>
            <a href="{% url 'bowling_analytics' %}">Bowling Analytics</a>
            <a href="{% url 'inference:batting_prediction' %}">Batting Predictions</a>
            <a href="{% url 'inference:bowling_prediction' %}">Bowling Predictions</a>
            <a href="{% url 'model_comparison' %}">Model Comparison</a>
            <a href="{% url 'eda_insights' %}">EDA & Insights</a>
            <a href="{% url 'matches:match_explorer' %}">Match Explorer</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="d-flex justify-content-between align-items-center p-3 border-bottom">
            <strong>IPL Player Performance Analytics V2</strong>

            <button class="btn btn-outline-secondary btn-sm"
                    id="themeToggle"
                    type="button">
                Toggle theme
            </button>
        </header>

        {% block content %}{% endblock %}

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

<script>
    document.getElementById("themeToggle").addEventListener("click", function () {
        const root = document.documentElement;
        const current = root.getAttribute("data-bs-theme");
        const next = current === "dark" ? "light" : "dark";

        root.setAttribute("data-bs-theme", next);
        localStorage.setItem("ipl-theme", next);
    });
</script>

</body>
</html>
